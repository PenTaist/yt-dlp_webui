limit_req_zone $binary_remote_addr zone=ytdlp_jobs:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ytdlp_all:10m rate=10r/s;

upstream ytdlp_web {
    server 127.0.0.1:8083;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name yt-dlp.pentaist.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yt-dlp.pentaist.fr;

    ssl_certificate     /etc/letsencrypt/live/yt-dlp.pentaist.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yt-dlp.pentaist.fr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:ytdlp_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    access_log /var/log/nginx/ytdlp-web.access.log;
    error_log  /var/log/nginx/ytdlp-web.error.log;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;

    location = /api/jobs {
        limit_req zone=ytdlp_jobs burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://ytdlp_web;
    }

    location ~ "^/api/jobs/[0-9a-f]{32}/file$" {
        proxy_pass http://ytdlp_web;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
    }

    location / {
        limit_req zone=ytdlp_all burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://ytdlp_web;
    }
}